name: Production Pipeline

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint And Syntax Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fatal Flake8 checks
        run: |
          flake8 --select=E9,F63,F7,F82 --show-source vivu_backend

      - name: Compile critical Python modules
        run: |
          python -m py_compile \
            vivu_backend/vivu_core/settings.py \
            vivu_backend/agents/travel_agents/vector_db.py \
            vivu_backend/apps/api/travel_plan_step_views.py \
            vivu_backend/apps/api/travel_plan_views.py

  tests:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_ENGINE: django.db.backends.sqlite3
      SQLITE_DB_PATH: vivu_backend/vivudb.sqlite3
      DJANGO_SECRET_KEY: github-actions-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CHROMA_PERSIST_DIRECTORY: vector_db_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        working-directory: vivu_backend
        run: python manage.py check

      - name: Run protected integration suites
        working-directory: vivu_backend
        run: |
          python manage.py test \
            apps.api.tests.test_end_to_end_workflows \
            apps.api.tests.test_database_crud \
            apps.api.tests.test_travel_plan_auth \
            tests.test_save_travel_plan_view \
            --verbosity 1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker compose rendering
        run: docker compose config

      - name: Build production image
        run: docker build --file Dockerfile --tag vivu-travel-planner:ci .

  deployment-notify:
    name: Deployment Notification Blueprint
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Emit staged deployment notice
        run: |
          echo "::notice title=Deployment Blueprint::Build, lint, and integration tests passed. Connect this job to your staging or production deployment target."
