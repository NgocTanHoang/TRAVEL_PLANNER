services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivu-web
    command: >
      sh -c "python vivu_backend/manage.py migrate &&
             python vivu_backend/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_URL: http://chromadb:8000
      VECTOR_DB_PATH: /app/vector_db
    volumes:
      - ./:/app
      - ./vector_db:/app/vector_db
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    working_dir: /app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vivu-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: vivu-chromadb
    ports:
      - "8019:8000"
    volumes:
      - ./vector_db_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -qi ':1F40' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
