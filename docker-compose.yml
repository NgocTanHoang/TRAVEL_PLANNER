services:
  db:
    image: postgres:16-alpine
    container_name: vivu-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vivu-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivu-web
    command: >
      sh -c "python vivu_backend/manage.py migrate &&
             python vivu_backend/manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_URL: http://chroma:8000
      CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-vector_db_data}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    networks:
      - vivu-network

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["scraper"]
    command: >
      sh -c "python vivu_scraper/scripts/run_public_pipeline.py --help"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_URL: http://chroma:8000
      CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-vector_db_data}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./vivu_scraper/outputs:/app/vivu_scraper/outputs
    restart: "no"
    networks:
      - vivu-network

  redis:
    image: redis:7-alpine
    container_name: vivu-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vivu-network

  chroma:
    image: chromadb/chroma:latest
    container_name: vivu-chroma
    ports:
      - "8019:8000"
    volumes:
      - ./${CHROMA_PERSIST_DIRECTORY:-vector_db_data}:/data/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -qi ':1F40' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vivu-network

volumes:
  postgres_data:
  redis_data:

networks:
  vivu-network:
    driver: bridge
